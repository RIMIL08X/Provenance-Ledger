[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "provenance-ledger"
version = "0.1.0"
description = "A continuous provenance-and-reproducibility auditing layer for LLM data science agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.18",
    "pydantic>=2.7.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.1",
    "streamlit>=1.35.0",
    "pytest>=8.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
